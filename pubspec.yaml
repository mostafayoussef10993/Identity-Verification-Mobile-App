# pubspec.yaml
# ══════════════════════════════════════════════════════════════════════════════
# FIX: assets section — changed assets/regula/db.dat to assets/regula/
# (folder declaration is required so Flutter bundles all files in the folder)
# ══════════════════════════════════════════════════════════════════════════════

name: kyc
description: "Production KYC Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5

  # ── Regula Document Reader SDK ────────────────────────────────────────────
  flutter_document_reader_api: ^9.4.0
  flutter_document_reader_core_fullrfid: ^9.0.0

  # ── Regula Face SDK ───────────────────────────────────────────────────────
  flutter_face_api: ^8.2.1092
  flutter_face_core_match: ^8.2.462

  # ── State management ──────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.8.0+1

  # ── Local storage ─────────────────────────────────────────────────────────
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # ── Media ─────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  camera: ^0.11.1
  image: ^4.3.0

  # ── Device ────────────────────────────────────────────────────────────────
  device_info_plus: ^11.3.3

  # ── Utilities ─────────────────────────────────────────────────────────────
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/regula.license
    # FIX: folder declaration (not file) — bundles db.dat + any other files
    - assets/regula/
    - assets/
